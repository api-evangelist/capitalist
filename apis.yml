apis:
- aid: capitalist:capitalist-api
  name: Capitalist API
  description: >-
    The current Capitalist API — published as the "Integration API" — enables programmatic
    mass payouts, currency and digital-asset conversion, and balance, transaction and
    merchant-order reporting across Capitalist's supported payment systems. It is a
    JSON-over-HTTPS REST surface at https://api2.capitalist.net that creates and tracks
    outbound payouts across roughly 45 payment channels (cards, bank transfers, mobile
    operators, fast payment systems, e-wallets and cryptocurrencies), issues ephemeral
    cryptocurrency deposit addresses, and runs end-user KYC. Every request carries three
    headers — API-Key, X-Request-Timestamp and a SHA-256 signature over the timestamp,
    the raw body and the API secret — and payment outcomes are delivered to a per-request
    callbackUrl signed the same way. It is designed for businesses that need to pay large
    numbers of recipients (affiliates, freelancers, publishers) without maintaining
    separate accounts in each underlying payment system.
  humanURL: https://capitalist.net/developers/api
  baseURL: https://api2.capitalist.net
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/capitalist.png
  tags:
  - Bulk Payouts
  - Cryptocurrency
  - KYC
  - Mass Payments
  - Payments
  - Payouts
  properties:
