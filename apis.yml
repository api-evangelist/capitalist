    url: openapi/capitalist-integration-api-openapi.json
    name: Capitalist Integration API OpenAPI 3.0.1
    description: >-
      First-party OpenAPI published by Capitalist at
      https://github.com/capitalist-net/API-V2/blob/main/java-client/api-definition/Integration+API.json
      and consumed by the provider's own openapi-generator build to produce its Java client.
      Saved verbatim. servers[0] is https://api2.capitalist.net, the base URL the provider's
      own documentation states.
  - type: Overlay
