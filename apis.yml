name: Capitalist
description: >-
  Capitalist is a payment platform that lets businesses make mass payouts
  and receive money across multiple payment systems and cryptocurrencies
  without having to open separate accounts with each. The Capitalist
  Integration API automates bulk payouts to cards, bank transfers, mobile
  operators, fast payment systems, e-wallets and cryptocurrencies, converts
  between fiat and digital-asset balances, reads exchange rates and account
  balances, retrieves transaction and merchant-order history, and runs
  end-user KYC — for fintech, affiliate-network, and marketplace use cases
  operating across the CIS region and globally.
