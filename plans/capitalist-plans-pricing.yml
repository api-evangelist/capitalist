specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Capitalist
providerId: capitalist
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://capitalist.net/fees
description: >-
  Capitalist publishes NO API subscription plans. There is no free/pro/enterprise
  tiering, no per-call price and no API quota for sale. The commercial model is
  transactional: the platform charges a per-operation commission that varies by
  payment channel, currency and direction, published as fee tables at
  https://capitalist.net/fees, and merchant acquiring rates are negotiated
  individually. API access itself is a feature of a funded account, gated on
  enabling API access and Google 2FA at https://capitalist.net/security, not on
  a plan purchase. This file replaces a 2026-05-04 scaffold that invented three
  tiers with TBD prices and fabricated request quotas.
tags:
  - Bulk Payouts
  - Cryptocurrency
  - Finance
  - Mass Payments
  - Payment Platform
  - Payments
  - Payouts
  - Remittance
plan_count: 0
plans: []
pricing_model:
  type: transactional
  unit: per payment / per deposit / per conversion
  api_access_price: 0
  api_access_note: >-
    No charge is published for API access. The prerequisite is an account with
    API access enabled and Google 2FA active.
  fee_surfaces:
    - name: USD, EUR operations
      description: Deposit and withdrawal commissions per payment channel.
      url: https://capitalist.net/fees
    - name: Capitalist cards
      description: Card issue, monthly maintenance, load/unload, transaction and conversion fees, plus load and spend limits.
      url: https://capitalist.net/fees
    - name: Merchant service
      description: >-
        Acquiring rates for receiving funds. The provider states "Final rates for
        receiving funds and payments are agreed upon after a detailed study of
        the type of activity and category of the Merchant" — i.e. negotiated,
        not listed.
      url: https://capitalist.net/fees
    - name: Additional services
      description: >-
        Manual operations priced separately, including "Search for payment",
        "Search for incorrect payment" (percentage of payment amount, min. 10
        USD), "Payment return (Wire)" and "SWIFT inquiry (Wire)".
      url: https://capitalist.net/fees
  runtime_fee_visibility:
    description: >-
      The fee actually charged is returned per transaction rather than looked up
      from a price list: the payment status response and the callback body both
      carry a `fee` field. The deprecated v1 API additionally exposed a
      get_document_fee operation for pre-quoting.
    fields: [fee]
    docs: https://docs.capitalist.net/api/integration-api.html
  machine_readable: false
  machine_readable_note: >-
    The fee tables are rendered client-side from an internal endpoint and are
    described in the page copy as "Dynamic commission is updating every few
    minutes". No public pricing or tariff API is documented, so an agent cannot
    read Capitalist's prices programmatically before transacting — it can only
    read the fee charged after the fact.
  evidence:
    - url: https://capitalist.net/fees
      status: 200
      checked: '2026-09-05'
