    source: https://github.com/capitalist-net/API-V2
    api: Capitalist Integration API (v2)
    install: git clone https://github.com/capitalist-net/API-V2 && mvn -f java-client/pom.xml install
    version: '1.0'
    published: '2025-12-02'
    published_source: >-
      Repo pushed_at from the GitHub API (2025-12-02T16:06:56Z); version read
      from java-client/pom.xml <version>1.0</version>. Not on Maven Central —
      a search.maven.org query for g:ru.capitalist returned no artifacts on
      2026-09-05, so `version: '1.0'` is the declared POM version, not a
      published release.
    note: >-
      Multi-module Maven project. The client module is GENERATED from
      java-client/api-definition/Integration+API.json by
      openapi-generator-maven-plugin 7.14.0; the hand-written parts are
      CapitalistApi.java, CapitalistApiClient.java and SignatureInterceptor.java
      (the API-Key/X-Request-Timestamp/Signature request signer). Ships three
      runnable examples: CreatePaymentExample, GetAccountListExample,
      GetRateExample.

