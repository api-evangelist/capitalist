provider: Capitalist
providerId: capitalist
description: >-
  Capitalist ships first-party client code, but does not PUBLISH it to any
  package registry. Every official library below is consumed by cloning or
  vendoring a GitHub repository — none resolves from npm, Packagist, Maven
  Central, PyPI, NuGet, RubyGems, crates.io or pkg.go.dev. The php-api-samples
  repo carries a composer.json declaring version 2.8.0 and the name
  capitalist-net/php-api-samples, but that package name returns 404 from
  repo.packagist.org, so `composer require` cannot install it without a VCS
  repository entry. The Java client is not a hand-written SDK at all: it is
  generated at build time by openapi-generator-maven-plugin 7.14.0 from the
  provider's own Integration+API.json, which is what makes that file the
  canonical first-party contract.
registry_coverage:
  npm: absent
  packagist: absent
  maven_central: absent
  pypi: absent
  nuget: absent
  rubygems: absent
  crates: absent
  go: absent

