gaps:
  - No first-party package on any language registry, so no dependency-manager
    install path exists for any language.
  - No JavaScript/TypeScript, Python, Go, Ruby or .NET library at all — the two
    C# repos are snippets.
  - Only the Java client targets the current v2 Integration API. Every other
    first-party repo wraps the deprecated v1 surface.
  - The most-used community PHP package (15k installs) fills a gap the provider
    left open, with no provider oversight.

